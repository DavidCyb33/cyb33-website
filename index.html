
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYB33 | Reliable by Nature. Digital by Design.</title>
  <meta name="description" content="CYB33 provides reliable digital solutions for businesses of all sizes. From websites and automation to reporting and digital support, we deliver progress with less disruption.">
  <style>
body {
  margin: 0;
  min-height: 100vh;
  background: #ffffff;
  font-family: Arial, sans-serif;
  color: #111111;
}
/* CYB33 Navigation */
.header-brand {
  position: relative;
  color: #111111;
  text-decoration: none;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
}

.header-brand span {
  color: #800020;
}

.header-brand .brand-plus {
  font-size: 13px;
  vertical-align: top;
  margin-left: 3px;
}
.site-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #ffffff;
  border-bottom: 1px solid #eeeeee;
  padding: 24px 5%;
}

.navigation {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 32px;
  flex-wrap: wrap;
}

.navigation a {
  color: #111111;
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: color 0.2s ease;
}

.navigation a:hover,
.navigation a:focus-visible {
  color: #800020;
}

.navigation a:last-child {
  background: #800020;
  color: #ffffff;
  padding: 12px 20px;
  border-radius: 4px;
}

.navigation a:last-child:hover,
.navigation a:last-child:focus-visible {
  background: #600018;
}
    main {
      text-align: center;
      padding: 32px;
    }

    .logo {
      position: relative;
      display: inline-block;
      border: 2px solid #111111;
      padding: 20px 32px;
      font-size: clamp(40px, 9vw, 80px);
      font-weight: bold;
      letter-spacing: -3px;
    }

    .logo span {
      color: #800020;
    }

    .plus {
      position: absolute;
      right: -12px;
      bottom: -12px;
      background: #800020;
      color: white;
      font-size: 24px;
      padding: 2px 9px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 25px;
      font-size: 14px;
      letter-spacing: 5px;
    }

    p {
      margin-top: 40px;
      color: #555555;
    }
  </style>
</head>
<body>
  
<header class="site-header">
  <a href="#home" class="header-brand" aria-label="CYB33 Home">
    CYB<span>33</span><span class="brand-plus">+</span>
  </a>

  <nav class="navigation" aria-label="Main navigation">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </nav>
</header>
  <main>
    <div class="logo">
      CYB<span>33</span>
      <div class="plus">+</div>
    </div>

    <div class="subtitle">DIGITAL SOLUTIONS</div>

    <p>Our new website is coming soon.</p>
  </main>
</body>
</html>
