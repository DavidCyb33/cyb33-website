
<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYB33 | Reliable by Nature. Digital by Design.</title>
  <meta name="description" content="CYB33 provides reliable digital solutions for businesses of all sizes. From websites and automation to reporting and digital support, we deliver progress with less disruption.">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ffffff;
      font-family: Arial, sans-serif;
      color: #111111;
    }

    main {
      text-align: center;
      padding: 32px;
    }

    .logo {
      position: relative;
      display: inline-block;
      border: 2px solid #111111;
      padding: 20px 32px;
      font-size: clamp(40px, 9vw, 80px);
      font-weight: bold;
      letter-spacing: -3px;
    }

    .logo span {
      color: #800020;
    }

    .plus {
      position: absolute;
      right: -12px;
      bottom: -12px;
      background: #800020;
      color: white;
      font-size: 24px;
      padding: 2px 9px;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 25px;
      font-size: 14px;
      letter-spacing: 5px;
    }

    p {
      margin-top: 40px;
      color: #555555;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">
      CYB<span>33</span>
      <div class="plus">+</div>
    </div>

    <div class="subtitle">DIGITAL SOLUTIONS</div>

    <p>Our new website is coming soon.</p>
  </main>
</body>
</html>
